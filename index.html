<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Followset: your weekly lifting program. Log sets, run superset rest timers, and keep the demo on screen." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Followset" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Followset</title>
    <script>
      // Google OAuth web client for Drive sync. Authorized JavaScript origin: https://jordanshipwreck.github.io
      window.FITTY_GOOGLE_CLIENT_ID = "291839312302-auu92fn40nt17uchbsfqt75gv4pvkt6u.apps.googleusercontent.com";
    </script>
    <style>
      html,body{margin:0;background:#0a0a0b}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#f4f4f1;font:500 16px/1.4 ui-sans-serif,system-ui,sans-serif;text-align:center}
      #boot .mark{width:56px;height:56px;border-radius:18px;background:#d4ff3f;color:#0e1200;display:grid;place-items:center;font-weight:800;font-size:26px}
      #boot pre{display:none;max-width:100%;white-space:pre-wrap;text-align:left;font-size:12px;color:#ff8a7a;background:#151517;padding:12px;border-radius:14px;overflow:auto;max-height:40vh}
      #boot .acts{display:none;gap:10px}
      #boot button{border:0;border-radius:999px;padding:12px 18px;font:600 15px ui-sans-serif,system-ui,sans-serif;background:#1e1e21;color:#f4f4f1}
      #boot button.p{background:#d4ff3f;color:#0e1200}
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="mark">F</div>
      <div id="boot-status">Loading Followset…</div>
      <pre id="boot-error"></pre>
      <div class="acts" id="boot-acts">
        <button type="button" class="p" onclick="location.reload()">Try again</button>
        <button type="button" id="boot-reset">Reset app cache</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Minimal boot guard. The app hides this on first render; any startup error shows here
      // with a cache reset that keeps workouts (they live in localStorage, not the cache).
      (function () {
        var boot = document.getElementById("boot");
        var done = false;
        function show(msg) {
          if (done) return;
          document.getElementById("boot-status").textContent = "Followset hit a problem";
          var pre = document.getElementById("boot-error");
          if (msg) { pre.textContent = msg; pre.style.display = "block"; }
          document.getElementById("boot-acts").style.display = "flex";
          boot.style.display = "flex";
        }
        window.__fittyBootDone = function () { done = true; boot.style.display = "none"; };
        window.__fittyBootFail = function (e) {
          done = false;
          show(e && e.stack ? e.stack : String(e));
        };
        window.addEventListener("error", function (e) { show(String(e.error && e.error.stack || e.message)); });
        window.addEventListener("unhandledrejection", function (e) { if (!done) show(String(e.reason && e.reason.stack || e.reason)); });
        setTimeout(function () { if (!done) show("Still starting. Saved workouts stay if you reset the cache."); }, 8000);
        document.getElementById("boot-reset").addEventListener("click", function () {
          var tasks = [];
          try {
            if (navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
            if (window.caches) tasks.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
          } catch (e) {}
          var go = function () { location.reload(); };
          setTimeout(go, 2000);
          Promise.all(tasks).then(go, go);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
